# --- Basic config ---
set -g mouse on             # enable mouse mode (scrolling/clicking)
set -g history-limit 100000 # Lots of scrollback

set -g base-index 1         # count windows from 1
setw -g pane-base-index 1   # count panes from 1

set -g default-terminal "tmux-256color" # color support
set -ga terminal-overrides ",*:RGB"     # color supprt

set -sg escape-time 10      # Faster escape handling (helps with Vim)

# --- Plugin paths ---
set -g @plugin_dir "$HOME/.config/tmux/plugins"

# --- tmux-prefix-highlight config ---
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_show_sync_mode 'on'
set -g status-right "#{prefix_highlight} %H:%M %d-%b" # add prefix-highlight to right side of status bar

# --- Auto Plugin bootstrap Code ---
if-shell "test -f $HOME/.config/tmux/plugins/tmux-prefix-highlight/prefix_highlight.tmux" \
  "run-shell $HOME/.config/tmux/plugins/tmux-prefix-highlight/prefix_highlight.tmux"
